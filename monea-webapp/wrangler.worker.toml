# Cloudflare Worker API Configuration for MONEA
name = "monea-api"
main = "monea-worker/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Path alias resolution — mirrors tsconfig.json paths
[alias]
"@" = "./src"
"@/server" = "./monea-worker"

