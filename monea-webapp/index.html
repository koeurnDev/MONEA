    <!-- Service Worker Registration for Mobile Performance -->
    <script>
      const isLocalDevelopment = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isLocalDevelopment && 'serviceWorker' in navigator) {
        // Never let the production asset worker cache Vite's dev dependency
        // modules. Stale React chunks can create duplicate React instances.
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
        if ('caches' in window) {
          caches.keys().then(names => names.forEach(name => caches.delete(name)));
        }
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              registration.update();
            })
            .catch(error => {
              console.warn('SW registration failed:', error);
            });
        });
      }
    </script>
