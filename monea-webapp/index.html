    <!-- Service Worker Registration for Mobile Performance -->
    <script>
      const isLocalDevelopment = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isLocalDevelopment && 'serviceWorker' in navigator) {
        // Never let the production asset worker cache Vite's dev dependency
        // modules. Stale React chunks can create duplicate React instances.
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        }).catch(error => console.warn('Unable to unregister service workers:', error));
        if ('caches' in window) {
          caches.keys().then(names => names.forEach(name => caches.delete(name))).catch(error => {
            console.warn('Unable to clear service worker caches:', error);
          });
        }
      } else if ('serviceWorker' in navigator) {
        // The landing page does not need an offline worker. Remove older
        // registrations so stale shell caches cannot affect performance audits.
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        }).catch(error => console.warn('Unable to unregister service workers:', error));
      }
    </script>
