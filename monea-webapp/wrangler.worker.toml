# Legacy embedded API Worker config. Use ../monea-api-worker/wrangler.toml for
# development and deployment; this config must not target the production Worker.
name = "monea-api-webapp-legacy"
main = "monea-worker/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Path alias resolution — mirrors tsconfig.json paths
[alias]
"@" = "./src"
"@/server" = "./monea-worker"
