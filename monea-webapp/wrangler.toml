# ── Worker Config ──────────────────────────────────────
name               = "monea-api"
main               = "monea-worker/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id         = "6f3829f29a00c554ec410089f42b6427"

# ── Pages Config ────────────────────────────────────────
# pages_build_output_dir = ".vercel/output/static"

[vars]
ENVIRONMENT       = "production"
BAKONG_API_URL    = "https://api-bakong.nbc.gov.kh"
NEXT_APP_URL      = "https://monea.pages.dev"

# Secrets — run these once before deploying:
# npx wrangler secret put DATABASE_URL
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put SECURITY_PEPPER
# npx wrangler secret put BAKONG_API_TOKEN
# npx wrangler secret put BAKONG_ACCOUNT_ID
# npx wrangler secret put BAKONG_MERCHANT_NAME
# npx wrangler secret put CLOUDINARY_API_SECRET
# npx wrangler secret put NEXT_PUBLIC_CLOUDINARY_API_KEY
# npx wrangler secret put NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
# npx wrangler secret put UPSTASH_REDIS_REST_URL
# npx wrangler secret put UPSTASH_REDIS_REST_TOKEN
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put CRON_SECRET
