name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Web app build and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monea-webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monea-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Check service worker contract
        run: npm run test:sw

  api-worker:
    name: API Worker type-check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monea-api-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monea-api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run admin validation and status tests
        run: npm run test:admin-master

      - name: Run security hardening tests
        run: npm run test:security-hardening
