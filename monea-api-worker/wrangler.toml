name = "monea-api"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

[vars]
# Environment variables
ENVIRONMENT = "production"
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://moneoez.com"
TELEGRAM_REDIRECT_URI = "https://moneoez.com/auth/telegram/callback"
R2_PUBLIC_BASE_URL = "https://media.moneoez.com"

[[r2_buckets]]
binding = "MONEA_MEDIA"
bucket_name = "monea-media"