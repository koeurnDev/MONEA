# Cloudflare Worker API Configuration for MONEA
name = "monea-api"
main = "monea-worker/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Path alias resolution — mirrors tsconfig.json paths
[alias]
"@/lib/prisma"              = "./src/lib/prisma"
"@/lib/auth"                = "./src/lib/auth"
"@/lib/constants"           = "./src/lib/constants"
"@/lib/crypto"              = "./src/lib/crypto"
"@/lib/encryption"          = "./src/lib/encryption"
"@/lib/ratelimit"           = "./src/lib/ratelimit"
"@/lib/sanitize"            = "./src/lib/sanitize"
"@/lib/utils"               = "./src/lib/utils"
"@/lib/mail"                = "./src/lib/mail"
"@/lib/sso"                 = "./src/lib/sso"
"@/lib/telegram"            = "./src/lib/telegram"
"@/lib/telegram-auth"       = "./src/lib/telegram-auth"
"@/lib/turnstile"           = "./src/lib/turnstile"
"@/lib/redis"               = "./src/lib/redis"
"@/lib/api-utils"           = "./src/lib/api-utils"
"@/lib/audit-utils"         = "./src/lib/audit-utils"
"@/lib/cloudinary-edge"     = "./src/lib/cloudinary-edge"
"@/lib/cloudinary"          = "./src/lib/cloudinary"
"@/lib/imagekit-edge"       = "./src/lib/imagekit-edge"
"@/lib/permissions"         = "./src/lib/permissions"
"@/lib/gift"                = "./src/lib/gift"
"@/lib/guest"               = "./src/lib/guest"
"@/lib/guestbook"           = "./src/lib/guestbook"
"@/lib/wedding"             = "./src/lib/wedding"
"@/lib/calendar"            = "./src/lib/calendar"
"@/lib/multi-cdn"           = "./src/lib/multi-cdn"
"@/lib/governance"          = "./src/lib/governance"
"@/lib/secrets"             = "./src/lib/secrets"
"@/lib/config"              = "./src/lib/config"
"@/lib/activity"            = "./src/lib/activity"
"@/lib/logger"              = "./src/lib/logger"
"@/lib/params-utils"        = "./src/lib/params-utils"
"@/lib/validations/guest"   = "./src/lib/validations/guest"
"@/lib/validations/guestbook" = "./src/lib/validations/guestbook"
"@/lib/validations/wedding" = "./src/lib/validations/wedding"
"@/services/GuestService"   = "./src/services/GuestService"
"@/types/auth"              = "./src/types/auth"
"@/server/auth_handlers/signin/handler"        = "./monea-worker/auth_handlers/signin/handler"
"@/server/auth_handlers/signup/handler"        = "./monea-worker/auth_handlers/signup/handler"
"@/server/auth_handlers/me/handler"            = "./monea-worker/auth_handlers/me/handler"
"@/server/auth_handlers/forgot-password/handler" = "./monea-worker/auth_handlers/forgot-password/handler"
"@/server/auth_handlers/sso/google/handler"    = "./monea-worker/auth_handlers/sso/google/handler"
"@/server/auth_handlers/sso/callback/handler"  = "./monea-worker/auth_handlers/sso/callback/handler"
"@/server/auth_handlers/sso/telegram/handler"  = "./monea-worker/auth_handlers/sso/telegram/handler"
